# Publica la web en GitHub Pages cada vez que se sube algo a main.
#
# Sube dos cosas: la app (que vive en la raíz) y la demostración (demo/).
# NO sube kit-finanzas/, que son las herramientas para montar apps y no
# tienen nada que hacer en la web.
#
# Por qué existe este archivo: el 6 de agosto la publicación se quedó
# atascada porque había dos sistemas intentando publicar a la vez —el
# automático de GitHub y uno propio— y se bloqueaban el uno al otro hasta
# agotar el tiempo. Desde entonces la web se quedó congelada. Ahora hay uno
# solo, y el "concurrency" de abajo se asegura de que nunca haya dos a la vez.

name: Publicar la web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uno cada vez. Si llega otro mientras hay uno en marcha, se cancela el
# viejo en vez de quedarse los dos esperando, que es lo que pasó antes.
concurrency:
  group: paginas
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar lo que se publica
        run: |
          mkdir -p _web
          rsync -a ./ _web/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_web' \
            --exclude 'kit-finanzas' \
            --exclude 'herramientas'
          # Sin este archivo, GitHub intenta interpretar la web con Jekyll y
          # se salta las carpetas que empiezan por guion bajo.
          touch _web/.nojekyll
          echo "Se publican estos archivos:"
          ls -la _web

      # La version de Gaby: la misma app (mismo codigo, misma base de
      # datos) pero con su nombre y su manifiesto, para que al instalarla
      # en su iPhone el icono diga el suyo. Se genera aqui a partir de
      # index.html para que nunca se quede atras. El apostrofe tipografico
      # de la marca va como secuencia unicode para que este archivo sea
      # ASCII puro (dos arranques seguidos fallaron con el caracter dentro).
      - name: Generar la pagina de Gaby
        run: |
          node -e '
            const fs = require("fs");
            const AP = "\u2019";
            let html = fs.readFileSync("_web/index.html", "utf8");
            html = html.split("Jerry" + AP + "s Life").join("Gaby" + AP + "s Life");
            html = html.split("Jerry" + AP + "s <span>").join("Gaby" + AP + "s <span>");
            html = html.split("Hola, Jerry").join("Hola, Gaby");
            html = html.replace("href=\"manifest.json", "href=\"manifest-gaby.json");
            fs.writeFileSync("_web/gaby.html", html);
            let man = fs.readFileSync("_web/manifest.json", "utf8");
            man = man.split("Jerry" + AP + "s Life").join("Gaby" + AP + "s Life");
            man = man.replace(/"start_url":\s*"[^"]*"/, "\"start_url\": \"gaby.html\"");
            fs.writeFileSync("_web/manifest-gaby.json", man);
            console.log("gaby.html y manifest-gaby.json generados");
          '
          grep -c "Gaby" _web/gaby.html _web/manifest-gaby.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _web

      - id: desplegar
        uses: actions/deploy-pages@v4
