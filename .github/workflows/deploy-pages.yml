# Publicación en GitHub Pages con un margen de espera mucho más largo.
#
# El workflow que GitHub genera solo (el de "Deploy from a branch") espera
# como mucho 10 minutos a que Pages termine de publicar y, si se agotan,
# ABORTA Y CANCELA el despliegue a medias. Cuando Pages va lento —como está
# pasando— eso deja la web sin actualizar aunque los archivos se hayan
# subido bien. Aquí el único cambio de fondo es darle 30 minutos en vez de
# 10, para que le dé tiempo a terminar en vez de cancelarse solo.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  # Permite relanzarlo a mano desde la pestaña Actions si hiciera falta.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress: false a propósito — si se cancelara el despliegue en
# curso al llegar un push nuevo, volveríamos justo al problema de dejar la
# publicación a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 9 minutos: uno menos que el límite interno de actions/deploy-pages.
    #
    # Ese límite NO se puede subir — se le pasó timeout: 1800000 (30 min) y
    # aun así abortó a los 600 s clavados, así que la acción lo capa. Y al
    # cumplirse no se limita a fallar: ejecuta "Canceling Pages
    # deployment...", es decir, mata una publicación que estaba avanzando
    # (el log muestra deployment_in_progress hasta el último segundo).
    #
    # Cortando el job un minuto antes, la acción nunca llega a esa línea y
    # la publicación sigue su curso en los servidores de Pages hasta
    # terminar sola. El workflow aparecerá en rojo por el corte: es
    # esperado y no significa que la web no se haya actualizado.
    timeout-minutes: 9
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Sitio estático servido tal cual desde la raíz del repo (no hay
      # compilación). La acción ya excluye .git y .github por su cuenta.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
